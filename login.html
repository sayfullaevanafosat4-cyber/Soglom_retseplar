<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Sog'lom Ovqatlanish</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="calculator-container">
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none">
                            <h2 class="text-success">
                                <i class="fas fa-apple-alt"></i> Sog'lom Hayot
                            </h2>
                        </a>
                        <p class="text-muted">Hisobingizga kiring</p>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Foydalanuvchi nomi
                            </label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Parol
                            </label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Eslab qolish</label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Kirish
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <p>Hisobingiz yo'qmi? 
                                <a href="register.html">Ro'yxatdan o'ting</a>
                            </p>
                            <p>
                                <a href="index.html" class="text-muted">
                                    <i class="fas fa-home"></i> Bosh sahifaga qaytish
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const user = db.loginUser(username, password);
                if (user) {
                    auth.saveUser(user);
                    showToast('Muvaffaqiyatli kirildi!', 'success');
                    
                    setTimeout(() => {
                        if (user.is_admin) {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    showToast('Login yoki parol xato!', 'error');
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
